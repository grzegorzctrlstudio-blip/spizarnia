const sum = (arr, k) => arr.reduce((a, s) => a + (s[k] || 0), 0);
const POSILEK = {
  sniadanie: { label: "Śniadanie", emoji: "🌅", color: "#EA580C", light: "#FFF7ED" },
  obiad:     { label: "Obiad",     emoji: "🍽️", color: "#16A34A", light: "#F0FDF4" },

};

// ─── COMPONENTS ───────────────────────────────────────────────────────────────
function MealTable({ meal, num }) {
  const [open, setOpen] = useState(false);
  const B = sum(meal.skladniki, "B"), W = sum(meal.skladniki, "W");
  const T = sum(meal.skladniki, "T"), K = sum(meal.skladniki, "kcal");
  const isNew = meal.nowy_przepis;

  return (
    <div style={{
      marginBottom: 16, borderRadius: 12, overflow: "hidden",
      border: isNew ? "2.5px solid #EA580C" : meal.nowe ? "2px solid #A78BFA" : "1.5px solid #E2E8F0",
      background: "#fff", boxShadow: isNew ? "0 4px 16px rgba(234,88,12,.12)" : "0 1px 4px rgba(0,0,0,.05)",
    }}>
      {/* Nagłówek */}
      <div style={{
        background: isNew ? "#FFF7ED" : meal.nowe ? "#F5F3FF" : "#F8FAFC",
        padding: "9px 14px", borderBottom: "1px solid #E2E8F0",
        display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8,
      }}>
        <div style={{ display: "flex", alignItems: "center", gap: 7, flexWrap: "wrap" }}>
          <span style={{ fontWeight: 800, fontSize: 13, color: "#111" }}>Propozycja {num}: {meal.name}</span>
          {isNew && <span style={{ background: "#EA580C", color: "#fff", borderRadius: 5, fontSize: 9, padding: "2px 7px", fontWeight: 800 }}>NOWE</span>}
          {meal.nowe && !isNew && <span style={{ background: "#7C3AED", color: "#fff", borderRadius: 5, fontSize: 9, padding: "2px 7px", fontWeight: 800 }}>NOWE</span>}
        </div>
        <span style={{ fontSize: 11, color: "#94A3B8", whiteSpace: "nowrap" }}>⏱ {meal.time}</span>
      </div>

      {/* Tabela makro */}
      <div style={{ overflowX: "auto" }}>
        <table style={{ width: "100%", borderCollapse: "collapse" }}>
          <thead>
            <tr style={{ background: "#F1F5F9" }}>
              {[["Składnik","left","#64748B"],["Ilość","right","#64748B"],["B g","right","#7C3AED"],["W g","right","#EA580C"],["T g","right","#16A34A"],["kcal","right","#0369A1"]].map(([l,a,c])=>(
                <th key={l} style={{ padding:"5px 6px", fontWeight:700, fontSize:11, color:c, borderBottom:"1px solid #E2E8F0", textAlign:a, background:"#F1F5F9", whiteSpace:"nowrap" }}>{l}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {meal.skladniki.map((s, i) => (
              <tr key={i} style={{ background: i%2===0?"#fff":"#FAFAFA", borderBottom:"1px solid #F1F5F9" }}>
                <td style={{ padding:"6px 14px", fontSize:12, color:"#1E293B" }}>{s.name}</td>
                <td style={{ padding:"6px 6px", fontSize:11, color:"#64748B", textAlign:"right", fontFamily:"monospace", whiteSpace:"nowrap" }}>{s.ile}</td>
                {[["B",s.B,"#7C3AED"],["W",s.W,"#EA580C"],["T",s.T,"#16A34A"],["k",s.kcal,"#0369A1"]].map(([k,v,c])=>(
                  <td key={k} style={{ padding:"6px 6px", textAlign:"right", fontFamily:"monospace", fontSize:12, color:v===0?"#CBD5E1":c, fontWeight:v===0?400:600 }}>{v}</td>
                ))}
              </tr>
            ))}
          </tbody>
          <tfoot>
            <tr style={{ background:"#1E293B" }}>
              <td colSpan={2} style={{ padding:"7px 14px", color:"#94A3B8", fontWeight:700, fontSize:11, letterSpacing:0.5 }}>SUMA</td>
              {[[B,"#C4B5FD"],[W,"#FDBA74"],[T,"#86EFAC"],[K,"#7DD3FC"]].map(([v,c],i)=>(
                <td key={i} style={{ padding:"7px 6px", textAlign:"right", color:c, fontWeight:800, fontFamily:"monospace", fontSize:12 }}>{v}{i===3?" kcal":""}</td>
              ))}
            </tr>
          </tfoot>
        </table>
      </div>

      {/* Przepis */}
      {meal.przepis && (
        <>
          <button onClick={() => setOpen(o => !o)} style={{
            width: "100%", background: open ? "#FFF7ED" : "#F8FAFC",
            border: "none", borderTop: "1px solid #E2E8F0",
            padding: "9px 14px", cursor: "pointer",
            display: "flex", alignItems: "center", justifyContent: "space-between",
            fontWeight: 700, fontSize: 12, color: open ? "#EA580C" : "#64748B",
          }}>
            <span>📋 Przepis + lista zakupów</span>
            <span style={{ transition: ".2s", transform: open ? "rotate(90deg)" : "none" }}>›</span>
          </button>
          {open && (
            <div style={{ padding: "14px 16px", background: "#FFFBF5", borderTop: "1px solid #FED7AA" }}>
              {/* Kroki */}
              <div style={{ fontWeight: 800, fontSize: 12, color: "#7C2D12", marginBottom: 8 }}>👨‍🍳 Jak zrobić:</div>
              <ol style={{ paddingLeft: 18, marginBottom: 14 }}>
                {meal.przepis.kroki.map((k, i) => (
                  <li key={i} style={{ fontSize: 12.5, color: "#374151", lineHeight: 1.6, marginBottom: 4 }}>{k}</li>
                ))}
              </ol>
              {/* Zakupy */}
              <div style={{ fontWeight: 800, fontSize: 12, color: "#7C2D12", marginBottom: 8 }}>🛒 Co kupić do tego dania:</div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                {meal.przepis.zakupy.map((z, i) => (
                  <span key={i} style={{
                    background: "#FEF3C7", border: "1px solid #FCD34D",
                    borderRadius: 20, padding: "3px 10px", fontSize: 11.5, color: "#78350F",
                  }}>🛒 {z}</span>
                ))}
              </div>
            </div>
          )}
        </>
      )}
    </div>
  );
}

      <div style={{ background: "linear-gradient(135deg,#1E3A8A,#4F46E5 55%,#7C3AED)", borderRadius: 18, padding: "18px 20px", marginBottom: 14, color: "#fff" }}>
        <div style={{ fontSize: 10, letterSpacing: 2, textTransform: "uppercase", opacity: 0.65, marginBottom: 2 }}>Plan żywieniowy · Biedronka Edition</div>
        <div style={{ fontWeight: 800, fontSize: 22, marginBottom: 6 }}>Grzegorz Skroński</div>
        <div style={{ fontSize: 11.5, opacity: 0.85, lineHeight: 1.7, marginBottom: 10 }}>
          ~3 060 kcal/dzień · produkty z Biedronki · 🐟 tylko łosoś wędzony<br/>
          📋 Każda potrawa ma przepis i listę zakupów — kliknij żeby rozwinąć
        </div>
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
          {["🐄 Wołowina mielona (M1 P3)", "🥩 Schab z batami (M2 P3)", "🍗 Kurczak z piekarnika (P4)", "✅ Wszystkie przepisy"].map(t => (
            <span key={t} style={{ background: "rgba(255,255,255,.15)", borderRadius: 20, padding: "3px 10px", fontSize: 10, fontWeight: 600 }}>{t}</span>
          ))}
        </div>
      </div>

      <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
        {[1, 2].map(n => (
          <button key={n} onClick={() => setMenu(n)} style={{
            flex: 1, padding: "11px", borderRadius: 12, border: "none",
            fontWeight: 800, fontSize: 14, cursor: "pointer",
            background: menu === n ? "#1E3A8A" : "#E2E8F0",
            color: menu === n ? "#fff" : "#64748B",
            boxShadow: menu === n ? "0 4px 14px rgba(30,58,138,.28)" : "none",
            transition: "all .2s",
          }}>Menu {n}</button>
        ))}
      </div>

      <div style={{ display: "flex", gap: 6, marginBottom: 14 }}>
        {Object.entries(POSILEK).map(([key, p]) => (
          <button key={key} onClick={() => setTab(key)} style={{
            flex: 1, padding: "8px 4px", borderRadius: 10, border: "none",
            fontWeight: 700, fontSize: 11, cursor: "pointer",
            background: tab === key ? p.color : "#F1F5F9",
            color: tab === key ? "#fff" : "#64748B",
            transition: "all .2s",
          }}>{p.emoji} {p.label}</button>
        ))}
      </div>

      <div>
        {data[tab].map((meal, i) => (
          <MealTable key={i} meal={meal} num={i + 1} />
        ))}
      </div>

      <div style={{ background: "#EFF6FF", border: "1.5px solid #93C5FD", borderRadius: 12, padding: "12px 14px", marginTop: 4, fontSize: 12, color: "#1E40AF", lineHeight: 1.8 }}>
        <strong>💊 Suplementacja (masz już):</strong> Kreatyna 5–7 g/dzień · Omega-3 1g × 2/dzień · Wit. D3 2000 IU + K2MK7 50 mcg · Chrom 200 mcg/dzień · Kompleks witamin
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
