<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🏠 Spiżarnia</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0F172A;min-height:100vh;padding-bottom:40px}

/* ── SPLASH ── */
#splash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:28px}
.spin{width:44px;height:44px;border:4px solid #334155;border-top-color:#22C55E;border-radius:50%;animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.spin-lbl{font-size:13px;color:#64748B;font-weight:600;text-align:center}

/* ── LOGIN ── */
#login{min-height:100vh;display:none;flex-direction:column;align-items:center;justify-content:center;padding:28px;gap:16px}
#login h2{font-size:24px;font-weight:900;color:#F1F5F9}
#login p{font-size:13px;color:#64748B;text-align:center;line-height:1.6}
.name-inp{width:100%;max-width:340px;background:#1E293B;border:2px solid #334155;border-radius:14px;padding:16px 18px;font-size:18px;color:#F1F5F9;outline:none;text-align:center;font-weight:700}
.name-inp:focus{border-color:#38BDF8}
.name-inp::placeholder{color:#475569;font-weight:400}
.login-btn{width:100%;max-width:340px;background:linear-gradient(135deg,#16A34A,#059669);color:#fff;border:none;border-radius:14px;padding:16px;font-size:17px;font-weight:900;cursor:pointer}
.login-btn:active{transform:scale(.97)}
.login-btn:disabled{background:#334155;color:#64748B}

/* ── HEADER ── */
.hdr{background:linear-gradient(135deg,#1E293B,#334155);padding:14px 16px 12px;border-bottom:1px solid #334155;position:sticky;top:0;z-index:10}
.hdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.title-row{display:flex;align-items:center;gap:8px}
.title-row h1{font-size:18px;font-weight:800;color:#F1F5F9}
.sync-pill{display:flex;align-items:center;gap:5px;background:#0F172A;border:1.5px solid #1E293B;border-radius:20px;padding:4px 10px}
.sdot{width:8px;height:8px;border-radius:50%;background:#22C55E;flex-shrink:0}
.sdot.pulse{animation:pulse 1s infinite}
.sdot.red{background:#EF4444}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.slbl{font-size:10px;font-weight:700;color:#94A3B8}
.user-pill{background:#1D4ED820;border:1.5px solid #1D4ED8;border-radius:20px;padding:4px 10px;font-size:11px;font-weight:800;color:#60A5FA}

.hdr-btns{display:flex;gap:6px}
.hbtn{background:#334155;border:none;border-radius:20px;padding:7px 12px;font-size:11px;font-weight:700;cursor:pointer;color:#94A3B8}
.hbtn.danger{color:#F87171}
.hbtn.log-btn{color:#818CF8}
.shop-bar{background:#0F172A;border:1.5px solid #334155;border-radius:12px;padding:10px 14px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.shop-date{font-size:11px;color:#94A3B8;font-weight:600;line-height:1.5}
.shop-date strong{color:#F1F5F9;font-size:12px;display:block}
.shop-btn{background:linear-gradient(135deg,#16A34A,#059669);border:none;color:#fff;border-radius:10px;padding:9px 14px;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap;flex-shrink:0}
.shop-btn:active{transform:scale(.95)}
.fresh-ok{font-size:10px;color:#22C55E;font-weight:700;margin-top:3px}
.fresh-warn{font-size:10px;color:#F59E0B;font-weight:700;margin-top:3px}
.fresh-bad{font-size:10px;color:#EF4444;font-weight:800;margin-top:3px;animation:blink2 1s infinite}
@keyframes blink2{0%,100%{opacity:1}50%{opacity:.5}}

.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:10px}
.stat{background:#0F172A;border-radius:11px;padding:9px 6px;text-align:center;border:1.5px solid #1E293B}
.stat-n{font-size:24px;font-weight:900;line-height:1}
.stat-l{font-size:9px;font-weight:700;margin-top:3px;text-transform:uppercase;letter-spacing:.8px}
.stat.red{border-color:#7F1D1D}.stat.red .stat-n{color:#F87171}.stat.red .stat-l{color:#EF4444}
.stat.grn{border-color:#14532D}.stat.grn .stat-n{color:#4ADE80}.stat.grn .stat-l{color:#22C55E}
.stat.all .stat-n{color:#94A3B8}.stat.all .stat-l{color:#475569}

.search-row{margin-bottom:10px;position:relative}
.sico{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:15px;pointer-events:none}
.sinp{width:100%;background:#0F172A;border:1.5px solid #334155;border-radius:10px;padding:9px 36px 9px 34px;font-size:13px;color:#F1F5F9;outline:none}
.sinp:focus{border-color:#38BDF8}
.sinp::placeholder{color:#475569}
.xbtn{display:none;position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:#64748B;font-size:16px;cursor:pointer}

.filters{display:flex;gap:6px}
.f{flex:1;padding:8px 4px;border-radius:10px;border:none;font-weight:700;font-size:11px;cursor:pointer;transition:all .15s}
.f.act{color:#fff}
.f:not(.act){background:#1E293B;color:#64748B}

/* ── LOG MODAL ── */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;align-items:flex-end;justify-content:center;padding:0}
.overlay.show{display:flex}
.log-modal{background:#1E293B;border-radius:20px 20px 0 0;width:100%;max-width:600px;max-height:80vh;display:flex;flex-direction:column;border-top:1px solid #334155}
.log-hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid #334155;flex-shrink:0}
.log-hdr h3{font-size:16px;font-weight:800;color:#F1F5F9}
.log-close{background:#334155;border:none;color:#94A3B8;border-radius:20px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer}
.log-body{overflow-y:auto;padding:12px 16px;flex:1}
.log-entry{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid #1E293B}
.log-entry:last-child{border-bottom:none}
.log-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;flex-shrink:0;color:#fff}
.log-info{flex:1;min-width:0}
.log-who{font-size:12px;font-weight:800;color:#F1F5F9}
.log-what{font-size:11.5px;color:#94A3B8;margin-top:2px;line-height:1.4}
.log-when{font-size:10px;color:#475569;margin-top:2px}
.log-badge{font-size:11px;font-weight:800;border-radius:6px;padding:2px 8px;flex-shrink:0;margin-top:2px}
.log-badge.up{background:#14532D;color:#4ADE80}
.log-badge.down{background:#7F1D1D;color:#F87171}
.log-empty{text-align:center;padding:40px 20px;color:#475569;font-size:13px}

/* ── BODY ── */
.body{padding:0 12px}
.cat{margin-top:14px}
.cat-hdr{font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:#475569;margin-bottom:7px;padding:0 2px;display:flex;align-items:center;gap:6px}
.item{background:#1E293B;border-radius:15px;margin-bottom:7px;padding:12px 13px;border:2px solid #334155}
.item.red{border-color:#7F1D1D;background:#1C0A0A}
.item.grn{border-color:#14532D;background:#0A1C0A}
.item.low{border-color:#78350F;background:#1C130A}
.item-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:9px}
.item-name{font-size:13px;font-weight:700;line-height:1.35;flex:1}
.item.red .item-name{color:#FCA5A5}
.item.grn .item-name{color:#86EFAC}
.item.low .item-name{color:#FCD34D}
.kup{flex-shrink:0;border-radius:11px;padding:7px 13px;font-size:15px;font-weight:900;text-align:center;line-height:1.2;white-space:nowrap}
.item.red .kup{background:#DC2626;color:#fff}
.item.low .kup{background:#D97706;color:#fff}
.item.grn .kup{background:#16A34A;color:#fff}
.prog-row{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.prog-bg{flex:1;height:8px;background:#0F172A;border-radius:20px;overflow:hidden}
.prog-fill{height:100%;border-radius:20px;transition:width .3s}
.item.red .prog-fill{background:linear-gradient(90deg,#DC2626,#EF4444)}
.item.low .prog-fill{background:linear-gradient(90deg,#D97706,#F59E0B)}
.item.grn .prog-fill{background:linear-gradient(90deg,#16A34A,#22C55E)}
.prog-txt{font-size:11px;font-weight:700;white-space:nowrap;flex-shrink:0}
.item.red .prog-txt{color:#F87171}
.item.low .prog-txt{color:#FCD34D}
.item.grn .prog-txt{color:#4ADE80}
.qty-row{display:flex;align-items:center;gap:8px}
.qty-lbl{font-size:10.5px;flex:1}
.qty-ctrl{display:flex;align-items:center;gap:4px}
.qbtn{width:42px;height:42px;border:none;border-radius:10px;font-size:22px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-user-select:none;user-select:none;flex-shrink:0}
.qbtn:active{transform:scale(.85)}
.item.red .qbtn{background:#7F1D1D;color:#FCA5A5}
.item.low .qbtn{background:#78350F;color:#FCD34D}
.item.grn .qbtn{background:#14532D;color:#86EFAC}
.qnum{min-width:48px;height:42px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0F172A;border-radius:10px}
.qnum-cur{font-size:20px;font-weight:900;line-height:1}
.item.red .qnum-cur{color:#FCA5A5}
.item.low .qnum-cur{color:#FCD34D}
.item.grn .qnum-cur{color:#4ADE80}
.qnum-unit{font-size:8.5px;color:#475569;font-weight:600;margin-top:1px}
.empty{text-align:center;padding:40px 20px;color:#475569;font-size:13px}
.empty div{font-size:36px;margin-bottom:8px}
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <div class="spin"></div>
  <p class="spin-lbl" id="splash-lbl">Łączenie z spiżarnią...</p>
</div>

<!-- LOGIN -->
<div id="login">
  <div style="font-size:52px">🏠</div>
  <h2>Spiżarnia</h2>
  <p>Jak masz na imię?</p>
  <input class="name-inp" id="name-inp" placeholder="Twoje imię..." maxlength="20"
    onkeydown="if(event.key==='Enter') doLogin()">
  <button class="login-btn" id="login-btn" onclick="doLogin()">Wejdź →</button>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <div class="hdr">
    <div class="hdr-top">
      <div class="title-row">
        <h1>🏠 Spiżarnia</h1>
        <div class="sync-pill">
          <div class="sdot pulse" id="sdot"></div>
          <span class="slbl" id="slbl">sync...</span>
        </div>
      </div>
      <div class="hdr-btns">
        <div class="user-pill" id="user-pill"></div>
        <button class="hbtn log-btn" onclick="openLog()">📋 Historia</button>
        <button class="hbtn danger" onclick="resetAll()">🗑️</button>
      </div>
    </div>
    <div class="stats">
      <div class="stat red"><div class="stat-n" id="n-red">0</div><div class="stat-l">🔴 Kupić</div></div>
      <div class="stat grn"><div class="stat-n" id="n-grn">0</div><div class="stat-l">🟢 Jest</div></div>
      <div class="stat all"><div class="stat-n" id="n-all">0</div><div class="stat-l">Produktów</div></div>
    </div>
    <div class="shop-bar">
      <div class="shop-date">
        <strong id="shop-date-lbl">Nie ustawiono daty zakupów</strong>
        <span id="shop-days-lbl"></span>
      </div>
      <button class="shop-btn" onclick="markShopping()">🛍️ Byłem w sklepie!</button>
    </div>
    <div class="search-row">
      <span class="sico">🔍</span>
      <input class="sinp" id="sinp" placeholder="Szukaj produktu..." oninput="onSearch(this.value)">
      <button class="xbtn" id="xbtn" onclick="clearSearch()">✕</button>
    </div>
    <div class="filters">
      <button class="f act" id="f-all" onclick="setFilter('all')" style="background:#334155">Wszystko</button>
      <button class="f" id="f-red" onclick="setFilter('red')">🔴 Kupić</button>
      <button class="f" id="f-grn" onclick="setFilter('grn')">🟢 Jest</button>
    </div>
  </div>
  <div class="body" id="body"></div>
</div>

<!-- LOG MODAL -->
<div class="overlay" id="log-overlay" onclick="if(event.target===this)closeLog()">
  <div class="log-modal">
    <div class="log-hdr">
      <h3>📋 Historia zmian</h3>
      <button class="log-close" onclick="closeLog()">Zamknij</button>
    </div>
    <div class="log-body" id="log-body"></div>
  </div>
</div>

<script>
const FB   = "https://spizarnia-fdf18-default-rtdb.europe-west1.firebasedatabase.app";
let lastShopTs = 0; // timestamp ostatnich zakupów
const LS_NAME = "spiz_name";

const CATS = [

// ── HELPERS ───────────────────────────────────────────────────────────────────
function fbKey(catId,name){
  return (catId+"__"+name).replace(/[.$#\[\]/]/g,"_").replace(/\s+/g,"_");
}

function mkState(){
  const s={};
  CATS.forEach(c=>c.items.forEach(it=>s[fbKey(c.id,it.n)]=0));
  return s;
}

// avatar color based on name
const COLORS=["#7C3AED","#DC2626","#D97706","#059669","#2563EB","#DB2777","#0891B2"];
function nameColor(n){ let h=0; for(let c of n) h=(h*31+c.charCodeAt(0))%COLORS.length; return COLORS[h]; }
function nameInitial(n){ return n.trim().charAt(0).toUpperCase(); }

// ── STATE ─────────────────────────────────────────────────────────────────────
let state={}, filter="all", searchQ="", userName="";

function getRoomId(){
  let h=location.hash.replace(/^#/,"").trim();
  if(!h){ h="room1"; history.replaceState(null,"",location.pathname+location.search+"#room1"); }
  return h;
}
const roomId=getRoomId();
const roomPath=FB+"/rooms/"+roomId;
const logPath=FB+"/logs/"+roomId;

// ── FIREBASE ──────────────────────────────────────────────────────────────────
function setSyncUI(m){
  const d=document.getElementById("sdot"),l=document.getElementById("slbl");
  if(m==="ok"){d.className="sdot";d.style.background="#22C55E";l.textContent="zsync";}
  else if(m==="saving"){d.className="sdot pulse";d.style.background="#F59E0B";l.textContent="zapis...";}
  else{d.className="sdot red";l.textContent="błąd";}
}

async function fbGet(path){
  const ctrl=new AbortController();
  const t=setTimeout(()=>ctrl.abort(),8000);
  try{
    const r=await fetch(path+".json",{signal:ctrl.signal});
    clearTimeout(t);
    if(!r.ok) throw new Error("Firebase błąd "+r.status);
    return r.json();
  }catch(e){
    clearTimeout(t);
    if(e.name==="AbortError") throw new Error("Timeout — Firebase nie odpowiada. Sprawdź reguły bazy.");
    throw e;
  }
}
async function fbPatch(path,data){
  const r=await fetch(path+".json",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});
  if(!r.ok) throw new Error(r.status);
}
async function fbPost(path,data){
  const r=await fetch(path+".json",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});
  if(!r.ok) throw new Error(r.status);
}

// ── LOG ───────────────────────────────────────────────────────────────────────
async function addLog(productName, oldVal, newVal){
  const delta = newVal - oldVal;
  await fbPost(logPath, {
    who: userName,
    what: productName,
    delta: delta,
    newVal: newVal,
    ts: Date.now()
  });
}

function openLog(){
  document.getElementById("log-overlay").classList.add("show");
  renderLog();
}
function closeLog(){ document.getElementById("log-overlay").classList.remove("show"); }

async function renderLog(){
  const body=document.getElementById("log-body");
  body.innerHTML=`<div class="log-empty" style="color:#475569">⏳ Ładowanie...</div>`;
  try{
    const data=await fbGet(logPath);
    if(!data){ body.innerHTML=`<div class="log-empty"><div>📋</div>Brak zmian</div>`; return; }
    // Firebase POST tworzy obiekty z kluczami push-ID — sortuj po ts
    const entries=Object.values(data).sort((a,b)=>b.ts-a.ts).slice(0,200);
    if(!entries.length){ body.innerHTML=`<div class="log-empty"><div>📋</div>Brak zmian</div>`; return; }
    body.innerHTML=entries.map(e=>{
      const d=new Date(e.ts);
      const gdy=d.toLocaleDateString("pl-PL",{day:"2-digit",month:"2-digit"})+
        " "+d.toLocaleTimeString("pl-PL",{hour:"2-digit",minute:"2-digit"});
      const delta=e.delta||0;
      const badge=delta>0
        ?`<span class="log-badge up">+${delta}</span>`
        :`<span class="log-badge down">${delta}</span>`;
      const color=nameColor(e.who||"?");
      const co=delta>0?"dodał/a":"zabrał/a";
      const ile=Math.abs(delta);
      return `<div class="log-entry">
        <div class="log-avatar" style="background:${color}">${nameInitial(e.who||"?")}</div>
        <div class="log-info">
          <div class="log-who">${e.who||"?"}</div>
          <div class="log-what">${co} ${ile} × ${e.what||"?"} <span style="color:#475569">(teraz: ${e.newVal})</span></div>
          <div class="log-when">${gdy}</div>
        </div>
        ${badge}
      </div>`;
    }).join("");
  }catch(err){
    body.innerHTML=`<div class="log-empty">❌ Błąd ładowania</div>`;
  }
}

// ── LOGIN ─────────────────────────────────────────────────────────────────────
function doLogin(){
  const n=document.getElementById("name-inp").value.trim();
  if(!n) return;
  userName=n;
  localStorage.setItem(LS_NAME,n);
  document.getElementById("login").style.display="none";
  document.getElementById("splash").style.display="flex";
  document.getElementById("splash-lbl").textContent="Łączenie z spiżarnią...";
  document.getElementById("user-pill").textContent="👤 "+n;
  startApp();
}

// ── INIT ──────────────────────────────────────────────────────────────────────
async function startApp(){
  try{
    const remote=await fbGet(roomPath);
    state=mkState();
    if(remote){
      Object.keys(remote).forEach(k=>{ if(k in state) state[k]=remote[k]||0; });
      if(remote.__shopTs) { lastShopTs=remote.__shopTs; }
    }
    updateShopBar();
    else { await fbPatch(roomPath,state); }
    document.getElementById("splash").style.display="none";
    document.getElementById("app").style.display="block";
    setSyncUI("ok");
    render();
    // polling co 3s
    setInterval(async()=>{
      try{
        const r=await fbGet(roomPath); if(!r) return;
        let ch=false;
        Object.keys(r).forEach(k=>{ if(k in state && r[k]!==state[k]){state[k]=r[k]||0;ch=true;} });
        if(r.__shopTs && r.__shopTs!==lastShopTs){lastShopTs=r.__shopTs;updateShopBar();ch=true;}
        if(ch) render(); setSyncUI("ok");
      }catch(e){ setSyncUI("err"); }
    },3000);
  }catch(e){
    document.querySelector(".spin").style.display="none";
    document.getElementById("splash-lbl").innerHTML="❌ Błąd: "+e.message+"<br><span style='font-size:11px;color:#475569'>Odśwież stronę (F5)</span>";
  }
}

// ── SAVE ──────────────────────────────────────────────────────────────────────
let saveTimer=null;
function scheduleSave(patch, productName, oldVal, newVal){
  setSyncUI("saving");
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    try{
      await fbPatch(roomPath,patch);
      await addLog(productName, oldVal, newVal);
      setSyncUI("ok");
    }catch(e){ setSyncUI("err"); }
  },600);
}

// ── ACTIONS ───────────────────────────────────────────────────────────────────
function change(id,delta,max,productName,btn){
  if(btn){btn.disabled=true; setTimeout(()=>btn.disabled=false,500);}
  const oldVal=state[id]||0;
  const newVal=Math.min(max*2,Math.max(0,oldVal+delta));
  if(newVal===oldVal) return;
  state[id]=newVal;
  render();
  scheduleSave({[id]:state[id]}, productName, oldVal, state[id]);
}

function resetAll(){
  if(!confirm("Zresetować wszystkie stany do zera?\n(wszyscy zobaczą reset)")) return;
  state=mkState(); render();
  fbPatch(roomPath,state).then(()=>addLog("🗑️ RESET przez "+userName,0,0));
}

function setFilter(f){
  filter=f;
  const col={all:"#334155",red:"#DC2626",grn:"#16A34A"};
  ["all","red","grn"].forEach(x=>{
    const el=document.getElementById("f-"+x);
    el.className="f"+(x===f?" act":"");
    el.style.background=x===f?col[x]:"";
  });
  render();
}

function onSearch(q){
  searchQ=q.toLowerCase().trim();
  document.getElementById("xbtn").style.display=q?"block":"none";
  render();
}
function clearSearch(){ document.getElementById("sinp").value=""; onSearch(""); }

function cls(cur,target){ return cur>=target?"grn":cur>0?"low":"red"; }

function markShopping(){
  if(!confirm("Zaznaczyć że dziś byłeś/aś w sklepie?")) return;
  lastShopTs = Date.now();
  fbPatch(roomPath, {__shopTs: lastShopTs});
  updateShopBar();
  render();
}

function updateShopBar(){
  const lbl = document.getElementById("shop-date-lbl");
  const sub = document.getElementById("shop-days-lbl");
  if(!lastShopTs){ lbl.textContent="Nie ustawiono daty zakupów"; sub.textContent=""; return; }
  const d = new Date(lastShopTs);
  const days = Math.floor((Date.now()-lastShopTs)/(1000*60*60*24));
  lbl.textContent = "Zakupy: "+d.toLocaleDateString("pl-PL",{weekday:"long",day:"numeric",month:"long"});
  sub.textContent = days===0?"dziś 🛍️":days===1?"wczoraj":days+" dni temu";
}

function getFreshness(it){
  if(!it.days || !lastShopTs) return null;
  const daysPassed = (Date.now()-lastShopTs)/(1000*60*60*24);
  const daysLeft = Math.round(it.days - daysPassed);
  return daysLeft;
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render(){
  const body=document.getElementById("body");
  let nR=0,nG=0,tot=0;
  CATS.forEach(c=>c.items.forEach(it=>{
    cls(state[fbKey(c.id,it.n)]||0,it.target)==="grn"?nG++:nR++;tot++;
  }));
  document.getElementById("n-red").textContent=nR;
  document.getElementById("n-grn").textContent=nG;
  document.getElementById("n-all").textContent=tot;

  let html="",any=false;
  CATS.forEach(cat=>{
    const vis=cat.items.filter(it=>{
      const c=cls(state[fbKey(cat.id,it.n)]||0,it.target);
      if(filter==="red"&&c==="grn") return false;
      if(filter==="grn"&&c!=="grn") return false;
      if(searchQ&&!it.n.toLowerCase().includes(searchQ)) return false;
      return true;
    });
    if(!vis.length) return;
    any=true;
    html+=`<div class="cat"><div class="cat-hdr"><span>${cat.ic}</span>${cat.label}</div>`;
    vis.forEach(it=>{
      const id=fbKey(cat.id,it.n);
      const ie=id.replace(/\\/g,"\\\\").replace(/'/g,"\\'");
      const nameEsc=it.n.replace(/'/g,"\\'");
      const cur=state[id]||0;
      const c=cls(cur,it.target);
      const pct=Math.min(100,Math.round(cur/it.target*100));
      const brak=Math.max(0,it.target-cur);
      const bt=c==="grn"?"✅ JEST":`KUP ${brak}`;
      const bs=c==="grn"?"":it.unit;
      const ql=c==="grn"
        ?`<span style="color:#22C55E">✅ Wystarczy na tydzień</span>`
        :c==="low"
          ?`<span style="color:#F59E0B">🟡 Mało — kup jeszcze ${brak} ${it.unit}</span>`
          :`<span style="color:#EF4444">🔴 Brak — kup ${brak} ${it.unit}</span>`;
      // Freshness
      const daysLeft = getFreshness(it);
      let freshHtml = "";
      if(daysLeft !== null){
        if(daysLeft <= 0) freshHtml=`<div class="fresh-bad">⚠️ Przeterminowane lub dziś!</div>`;
        else if(daysLeft === 1) freshHtml=`<div class="fresh-bad">🔴 Zostaje 1 dzień!</div>`;
        else if(daysLeft <= 2) freshHtml=`<div class="fresh-warn">🟡 Zostają ${daysLeft} dni</div>`;
        else freshHtml=`<div class="fresh-ok">✅ Świeże — zostaje ${daysLeft} dni</div>`;
      }
      let nm=it.n;
      if(searchQ){
        const i=it.n.toLowerCase().indexOf(searchQ);
        if(i>=0) nm=it.n.slice(0,i)+`<mark style="background:#FACC15;color:#0F172A;border-radius:3px;padding:0 2px">`+it.n.slice(i,i+searchQ.length)+`</mark>`+it.n.slice(i+searchQ.length);
      }
      html+=`<div class="item ${c}">
        <div class="item-top">
          <div class="item-name">${nm}${freshHtml}</div>
          <div class="kup">${bt}<br><span style="font-size:12px;opacity:.9;font-weight:700">${bs}</span></div>
        </div>
        <div class="prog-row">
          <div class="prog-bg"><div class="prog-fill" style="width:${pct}%"></div></div>
          <div class="prog-txt">${cur} / ${it.target} ${it.unit}</div>
        </div>
        <div class="qty-row">
          <div class="qty-lbl">${ql}</div>
          <div class="qty-ctrl">
            <button class="qbtn" onclick="change('${ie}',-1,${it.target},'${nameEsc}',this)">−</button>
            <div class="qnum"><div class="qnum-cur">${cur}</div><div class="qnum-unit">${it.unit}</div></div>
            <button class="qbtn" onclick="change('${ie}',1,${it.target},'${nameEsc}',this)">+</button>
          </div>
        </div>
      </div>`;
    });
    html+=`</div>`;
  });
  if(!any){
    const ic=searchQ?"🔍":filter==="red"?"🎉":"📦";
    const ms=searchQ?`Brak wyników dla "${searchQ}"`:filter==="red"?"Nic nie trzeba kupić!":"Brak produktów";
    html=`<div class="empty"><div>${ic}</div>${ms}</div>`;
  }
  body.innerHTML=html;
}

// ── START ─────────────────────────────────────────────────────────────────────
document.getElementById("splash").style.display="none";
const savedName=localStorage.getItem(LS_NAME);
if(savedName){
  userName=savedName;
  document.getElementById("user-pill").textContent="👤 "+savedName;
  document.getElementById("splash").style.display="flex";
  startApp();
} else {
  document.getElementById("login").style.display="flex";
}
</script>
</body>
